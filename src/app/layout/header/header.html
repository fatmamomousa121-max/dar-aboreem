<header class="top">
  <div class="wrap">
    <a class="brand" routerLink="/">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <g class="star">
          <rect x="9" y="9" width="22" height="22" rx="2" />
          <rect x="9" y="9" width="22" height="22" rx="2" transform="rotate(45 20 20)" />
        </g>
        <circle class="hole" cx="20" cy="20" r="5" />
      </svg>
      دار ابو ريم
    </a>

    <nav aria-label="الأقسام">
      @for (l of links; track l.path) {
        <a [routerLink]="l.path" routerLinkActive="active">{{ l.label }}</a>
      }
    </nav>

    <div class="actions">
      <!-- <button class="icon-btn" type="button" (click)="ui.toggleTheme()"
              [attr.aria-label]="ui.theme() === 'dark' ? 'الوضع الفاتح' : 'الوضع الداكن'">
        @if (ui.theme() === 'dark') {
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" /><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" /></svg>
        } @else {
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" /></svg>
        }
      </button> -->
      <button class="cart-btn" type="button" (click)="cart.isOpen.set(true)">
        السلة <span class="badge num">{{ cart.count() | arNum }}</span>
      </button>
    </div>
  </div>
</header>
